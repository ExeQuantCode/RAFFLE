name = "raffle"
version = "1.1.1"
author = "Ned Thaddeus Taylor"
maintainer = "n.t.taylor@exeter.ac.uk"
description = "A Fortran library and executable for structure prediction at material interfaces"

[preprocess]
[preprocess.cpp]
suffixes = ["F90", "f90"]
macros = ["ENABLE_ATHENA"]

[library]
source-dir="src/fortran"

[build]
auto-executables = true
auto-tests = true
auto-examples = false
module-naming = false

[dependencies]
openmp = "*"
athena = { git = "https://github.com/nedtaylor/athena", branch = "inverse-design-graphs" }


[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[executable]]
name="raffle_executable"
source-dir="app"
main="main.f90"
