name = "raffle"
version = "1.1.1"
author = "Ned Thaddeus Taylor"
maintainer = "n.t.taylor@exeter.ac.uk"
description = "A Fortran library and executable for structure prediction at material interfaces"

[preprocess]
[preprocess.cpp]
suffixes = ["F90", "f90"]
macros = ["ENABLE_ATHENA"]

[library]
source-dir="src/fortran"

[dependencies]
openmp = "*"
athena = { git = "https://github.com/nedtaylor/athena", tag = "v2.1.0" }


[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[[executable]]
name="raffle_executable"
source-dir="app"
main="main.f90"
